name: Sync data from the websites

# Every night: copy every country's files from its website into this repository,
# then mirror the repository to Hugging Face.
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-southeast-asia-transport-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download every country's files
        run: node scripts/sync.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laos thailand vietnam cambodia philippines
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Update datasets from the websites"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
              git rebase --abort 2>/dev/null || true
              echo "Push attempt $attempt failed, retrying."
              sleep 10
            done
            exit 1
          fi

      - name: Mirror to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path=".",
              repo_id="laosbustickets/southeast-asia-transport-data",
              repo_type="dataset",
              allow_patterns=["README.md", "datasets.json", "laos/**", "thailand/**", "vietnam/**", "cambodia/**", "philippines/**"],
              commit_message="Sync from GitHub",
          )
          PY
