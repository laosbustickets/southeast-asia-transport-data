name: Publish the npm package

# Saturdays after the Zenodo run: publish @seatransport/data to npm, versioned YYYY.M.D, when its data changed
# since the last release (packages/state.mjs). Setup: packages/SETUP.md (secret NPM_TOKEN; later trusted
# publishing with variable NPM_TRUSTED=true). Manual runs default to a dry run.
on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      force:
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      LIVE: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build and check
        id: build
        run: |
          node packages/build.mjs
          node packages/state.mjs check
          cd packages/dist/npm && npm pack --dry-run

      - name: Publish
        id: npm
        if: steps.build.outputs.npm == 'true' && env.LIVE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED }}
          V: ${{ steps.build.outputs.version }}
        run: |
          if [ "$TRUSTED" = "true" ]; then npm install -g npm@11 >/dev/null; export NODE_AUTH_TOKEN=""
          elif [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::npm not set up, skipped"; exit 0; fi
          npm view "@seatransport/data@$V" version >/dev/null 2>&1 || (cd packages/dist/npm && npm publish --access public --provenance)
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Record
        if: steps.npm.outputs.done == 'true'
        run: |
          node packages/state.mjs record npm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/published.json
          git diff --cached --quiet && exit 0
          git commit -m "npm package ${{ steps.build.outputs.version }} published"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 10
          done
          exit 1
