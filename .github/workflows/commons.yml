name: Keep the Commons maps current

# Manual only: Wikimedia blocks uploads from GitHub's runners (Azure range 20.64.0.0/16 is globally
# blocked as "open proxy/webhost" until 2028), so the weekly upload runs on the owner's PC instead
# (node scripts/commons.mjs). This workflow stays for a dry run: it reports which maps changed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what changed"
        type: boolean
        default: true

concurrency:
  group: commons-southeast-asia-transport-maps
  cancel-in-progress: false

jobs:
  commons:
    # Pinned: Playwright 1.57 cannot install Chromium on ubuntu-latest (Ubuntu 26.04 since Oct 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium (renders the PNG from each SVG)
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium

      - name: Upload changed maps
        env:
          COMMONS_BOT_USER: ${{ secrets.COMMONS_BOT_USER }}
          COMMONS_BOT_PASSWORD: ${{ secrets.COMMONS_BOT_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/commons.mjs
