name: Keep the Harvard Dataverse datasets current

# Every Saturday, after the week's site updates and the Zenodo run: a new Dataverse version for each
# country whose files changed on its website. The first run creates the collection and the six
# datasets. Run it by hand with "dry run" to see what would be published.
on:
  schedule:
    - cron: "47 4 * * 6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what changed"
        type: boolean
        default: true

concurrency:
  group: dataverse-southeast-asia-transport-data
  cancel-in-progress: false

jobs:
  dataverse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish changed datasets
        env:
          DATAVERSE_TOKEN: ${{ secrets.HARVARD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node scripts/dataverse.mjs
